min_maki_version = "0.7.1"

[permissions]
# maki.session.prompt needs `agent` and `session_write`.
agent = true
# maki.session.prompt and the focused maki.session.new({ focus = true }).
# maki refuses to persist a session with no messages, so the tab must open
# focused rather than as a stored background session.
session_write = true
# TurnStart arrives with its content redacted without this, which makes maki
# flash a one-time warning. Loop only reads metadata, but subscribes to
# TurnStart to notice a manual follow-up turn, and to ToolStart/ToolDone to
# tell a real model turn from an in-band provider error before rolling over.
session_read = true
# Loop state under the state dir.
fs_read = true
fs_write = true

# Not used: set_mode/set_title, chat input writes, network, processes, env.
session_settings = false
input = false
net = false
run = false
env = false
